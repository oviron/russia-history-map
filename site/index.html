<title>Атлас границ России</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Интерактивная карта границ Руси, России и СССР с 862 по 2026 год с хронологией приобретений и потерь.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Десктоп: карта слева, под ней шкала времени; справа — колонка летописи.
   До 900 px: карта на весь экран, шкала и летопись — в выдвижной нижней панели. */
:root {
  --paper: #f3f1ec;
  --panel: #fbfaf7;
  --ink: #1d2226;
  --muted: #5b6468;
  --faint: #8b9498;
  --rule: #dcd8cf;
  --sea: #d6e1e5;
  --sea-deep: #cad7dc;
  --land: #f4f1ea;
  --grat: rgba(70, 105, 120, .16);
  --ctx-a: #e9e5da;
  --ctx-b: #e2e5df;
  --ctx-c: #ece3d8;
  --ctx-d: #e3e2e7;
  --ctx-line: #b5b1a6;
  --state: #a8233a;
  --state-fill: rgba(168, 35, 58, .30);
  --state-soft: rgba(168, 35, 58, .09);
  --band-a: rgba(168, 35, 58, .20);
  --band-b: rgba(168, 35, 58, .34);
  --gain: #1f6b57;
  --loss: #a0650f;
  --occ: #2d3439;
  --auto: #6a3e8c;
  --annex: #a8233a;
  --focus: #1b5fa8;
  --glass: rgba(251, 250, 247, .9);
  --vignette: rgba(40, 60, 70, .16);
  --shadow: 0 1px 2px rgba(30, 30, 25, .08), 0 8px 24px rgba(30, 30, 25, .10);
  --r: 12px;
  --f-display: "Old Standard TT", "Times New Roman", Georgia, serif;
  --f-body: "PT Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111619; --panel: #161c1f; --ink: #e6e9e8; --muted: #a0aaad; --faint: #6d787c;
    --rule: #2a3337; --sea: #0d1316; --sea-deep: #0a0f11; --land: #1c2326; --grat: rgba(140, 170, 180, .10);
    --ctx-a: #252c2b; --ctx-b: #222a2f; --ctx-c: #2a2927; --ctx-d: #25252d; --ctx-line: #465054;
    --state: #e2566c; --state-fill: rgba(226, 86, 108, .30); --state-soft: rgba(226, 86, 108, .11);
    --band-a: rgba(226, 86, 108, .22); --band-b: rgba(226, 86, 108, .38);
    --gain: #4fc3a0; --loss: #e0a24a; --occ: #d6dcdc; --auto: #b48ad8; --annex: #e2566c; --focus: #6aa7ec;
    --glass: rgba(22, 28, 31, .88); --vignette: rgba(0, 0, 0, .5);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111619; --panel: #161c1f; --ink: #e6e9e8; --muted: #a0aaad; --faint: #6d787c;
  --rule: #2a3337; --sea: #0d1316; --sea-deep: #0a0f11; --land: #1c2326; --grat: rgba(140, 170, 180, .10);
  --ctx-a: #252c2b; --ctx-b: #222a2f; --ctx-c: #2a2927; --ctx-d: #25252d; --ctx-line: #465054;
  --state: #e2566c; --state-fill: rgba(226, 86, 108, .30); --state-soft: rgba(226, 86, 108, .11);
  --band-a: rgba(226, 86, 108, .22); --band-b: rgba(226, 86, 108, .38);
  --gain: #4fc3a0; --loss: #e0a24a; --occ: #d6dcdc; --auto: #b48ad8; --annex: #e2566c; --focus: #6aa7ec;
  --glass: rgba(22, 28, 31, .88); --vignette: rgba(0, 0, 0, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; }
body {
  margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font: 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 400px;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "map phead" "map feat" "map chron" "time chron";
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sheet { display: contents; }
.handle { display: none; }

/* ---------- карта ---------- */
.mapwrap { grid-area: map; position: relative; min-height: 0; overflow: hidden; background: var(--sea-deep); }
.mapwrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 110px var(--vignette); }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; -webkit-tap-highlight-color: transparent; }
#map:active { cursor: grabbing; }
.sphere { fill: var(--sea); }
.grat { fill: none; stroke: var(--grat); stroke-width: .7; }
.land { fill: var(--land); stroke: none; }
.lakes { fill: var(--sea); stroke: none; }
.ctx { stroke: var(--ctx-line); stroke-width: .6; stroke-linejoin: round; }
.ctx.c0 { fill: var(--ctx-a); } .ctx.c1 { fill: var(--ctx-b); } .ctx.c2 { fill: var(--ctx-c); } .ctx.c3 { fill: var(--ctx-d); }
.rusfill { fill: var(--state-soft); stroke: none; }
.rusline { fill: none; stroke: var(--state); stroke-width: .8; stroke-dasharray: 3 2; stroke-opacity: .85; }
.st { fill: var(--state-fill); stroke: var(--state); stroke-width: 1.6; stroke-linejoin: round; }
.rib { fill: none; stroke: var(--state); stroke-width: 9; stroke-opacity: .2; stroke-linejoin: round; }
.chg-gain { fill: url(#p-gain); stroke: var(--gain); stroke-width: 1.3; }
.chg-loss { fill: url(#p-loss); stroke: var(--loss); stroke-width: 1.3; stroke-dasharray: 4 3; }
.ov-occupied { fill: url(#p-occ); stroke: var(--occ); stroke-width: .9; stroke-dasharray: 2 2; }
.ov-autonomy { fill: url(#p-auto); stroke: var(--auto); stroke-width: .9; }
.ov-annexed { fill: url(#p-annex); stroke: var(--annex); stroke-width: 2; stroke-dasharray: 5 3; }
.ov-claimed { fill: url(#p-claim); stroke: var(--annex); stroke-width: 1.6; stroke-dasharray: 2 3; }
#world path { vector-effect: non-scaling-stroke; }
#g-change path, #g-over path { animation: appear .6s ease-out both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
.hl { stroke: var(--focus) !important; stroke-width: 2.2 !important; stroke-dasharray: none !important; }
.pat-gain { stroke: var(--gain); stroke-width: 1.5; }
.pat-loss { stroke: var(--loss); stroke-width: 1.5; }
.pat-occ { stroke: var(--occ); stroke-width: 1.1; }
.pat-auto { fill: var(--auto); }
.pat-annex { stroke: var(--annex); stroke-width: 2.2; }
.pat-claim { stroke: var(--annex); stroke-width: 1.2; }

.lbl { pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-width: 3.5px; stroke-linejoin: round; }
.lbl-state { font: 700 13px var(--f-display); letter-spacing: .16em; fill: var(--state); text-transform: uppercase; }
.lbl-ctx { font: 11px var(--f-body); letter-spacing: .03em; fill: var(--muted); }
.lbl-rus { font: italic 12px var(--f-display); fill: var(--state); }
.lbl-city { font: 11.5px var(--f-body); fill: var(--ink); }
.city { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; pointer-events: none; }
.ev { cursor: pointer; stroke: var(--panel); stroke-width: 1.6; r: 5px; }
.ev.cur { stroke: var(--ink); stroke-width: 2; r: 7px; }
.ev.k-gain, .pulse.k-gain { fill: var(--gain); color: var(--gain); }
.ev.k-loss, .pulse.k-loss { fill: var(--loss); color: var(--loss); }
.ev.k-occ, .pulse.k-occ { fill: var(--occ); color: var(--occ); }
.ev.k-annex, .pulse.k-annex { fill: var(--annex); color: var(--annex); }
.ev.k-event, .pulse.k-event { fill: var(--muted); color: var(--muted); }
.pulse { fill: none !important; stroke: currentColor; stroke-width: 2; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3.4); opacity: 0; } }
@media (pointer: coarse) { .ev { r: 7px; } .ev.cur { r: 9px; } }

.mapmsg {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 2;
  color: var(--muted); font: italic 18px var(--f-display); pointer-events: none; padding: 0 16px;
}

/* Карточка года поверх карты */
.card {
  position: absolute; z-index: 3; top: 16px; left: max(16px, env(safe-area-inset-left, 0px));
  max-width: 380px; padding: 12px 18px 13px;
  background: var(--glass); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3);
  border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
}
.brand { display: none; font: 700 10px/1.2 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.yr-row { display: flex; align-items: center; gap: 14px; }
.year { font: 400 60px/.92 var(--f-display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.02em; flex: none; }
.yr-side { min-width: 0; }
.statename { font: 700 19px/1.15 var(--f-display); color: var(--state); text-wrap: balance; }
.statename.none { color: var(--muted); font-weight: 400; font-style: italic; }
.stats { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 4px; font: 12.5px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stats .up { color: var(--gain); } .stats .down { color: var(--loss); }
.flags { display: grid; gap: 5px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.3; }
.flags:empty { display: none; }
.flag { display: flex; gap: 9px; align-items: flex-start; }
.flag svg { flex: none; margin-top: 1px; }
.gapnote { margin: 9px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); max-width: 40ch; }

.maptools {
  position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 8px;
  right: max(16px, env(safe-area-inset-right, 0px)); top: 16px;
}
.tool {
  width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
}
.tool:hover { border-color: var(--muted); }
.tool svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.tool[aria-pressed="true"] { color: var(--state); border-color: var(--state); }
.tool.m-only { display: none; }

.tip {
  position: absolute; pointer-events: none; z-index: 6; max-width: 290px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 11px; font-size: 13px; line-height: 1.35; box-shadow: var(--shadow);
}
.tip b { font-weight: 700; }
.tip .sub { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
.tip .src { color: var(--faint); font: 11px var(--f-mono); display: block; margin-top: 3px; }

/* ---------- колонка справа ---------- */
.phead, .feat, .chron { background: var(--panel); border-left: 1px solid var(--rule); }
.phead {
  grid-area: phead; display: flex; align-items: flex-start; gap: 12px;
  padding: 18px max(22px, env(safe-area-inset-right, 0px)) 14px 22px; border-bottom: 1px solid var(--rule);
}
.phead > div { flex: 1; min-width: 0; }
.phead h1 { margin: 0; font: 700 23px/1.1 var(--f-display); letter-spacing: .01em; }
.phead p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.linkbtn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 13px;
}
.linkbtn:hover { border-color: var(--muted); }

.feat {
  grid-area: feat; max-height: 46vh; overflow-y: auto;
  padding: 16px max(22px, env(safe-area-inset-right, 0px)) 16px 22px; border-bottom: 1px solid var(--rule);
}
.feat-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.when { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.feat-t { margin: 6px 0 0; font: 700 21px/1.2 var(--f-display); text-wrap: balance; }
.feat-meta { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.feat-meta b { font-weight: 400; color: var(--ink); }
.feat-x { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; }
.kind {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font: 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em;
}
.kind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.kind.k-gain { color: var(--gain); } .kind.k-loss { color: var(--loss); } .kind.k-occ { color: var(--occ); }
.kind.k-annex { color: var(--annex); } .kind.k-event { color: var(--muted); }

.chron { grid-area: chron; position: relative; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 28px; }
.chron-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 22px 8px; }
.chron-head h2 { margin: 0; font: 700 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chron-head span { font-size: 12px; color: var(--faint); text-align: right; }
.era-h {
  position: sticky; top: 0; z-index: 1; margin: 0;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 9px max(22px, env(safe-area-inset-right, 0px)) 7px 22px;
  background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-block: 1px solid var(--rule);
  font: 700 14px/1.25 var(--f-display); color: var(--state);
}
.era-h .era-y { flex: none; font: 11.5px var(--f-mono); color: var(--muted); font-weight: 400; }
.evitem {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 3px 10px;
  padding: 9px max(22px, env(safe-area-inset-right, 0px)) 9px 19px;
  border-left: 3px solid transparent; cursor: pointer;
}
.evitem + .evitem { border-top: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
.evitem:hover { background: var(--state-soft); }
.evitem .y { font: 16px/1.25 var(--f-display); font-variant-numeric: lining-nums tabular-nums; color: var(--muted); }
.evitem .t { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.evitem .meta { grid-column: 2; font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.evitem .x { grid-column: 2; font-size: 14px; line-height: 1.5; display: none; margin-top: 3px; }
.evitem.open .x { display: block; }
.evitem.future .y, .evitem.future .t { color: var(--faint); }
.evitem.future .kind { opacity: .6; }
.evitem.cur { border-left-color: var(--state); background: var(--state-soft); }
.evitem.cur .y { color: var(--state); }

/* ---------- шкала времени ---------- */
.time {
  grid-area: time; display: grid; align-items: center;
  grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ctrl over" "ctrl dial";
  column-gap: 18px; row-gap: 2px;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--rule);
}
.ctrls { grid-area: ctrl; display: flex; gap: 8px; align-items: center; }
.ctrl {
  width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; padding: 0;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 50%;
}
.ctrl:hover { border-color: var(--muted); }
.ctrl svg { width: 14px; height: 14px; fill: currentColor; }
.ctrl.play { width: 46px; height: 46px; background: var(--state); border-color: var(--state); color: #fff; box-shadow: 0 2px 8px rgba(168, 35, 58, .35); }
.ctrl.play svg { width: 16px; height: 16px; }

.over { grid-area: over; position: relative; height: 32px; }
#bands { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.band { stroke: var(--panel); stroke-width: 1.5; }
.band.b0 { fill: var(--band-a); } .band.b1 { fill: var(--band-b); }
.band.gap { fill: url(#p-claim); stroke: var(--rule); stroke-dasharray: 3 2; stroke-width: 1; opacity: .7; }
.bandlbl { font: 11px var(--f-body); fill: var(--ink); pointer-events: none; }
.tick { stroke-width: 1.3; }
.tick.k-gain { stroke: var(--gain); } .tick.k-loss { stroke: var(--loss); } .tick.k-occ { stroke: var(--occ); }
.tick.k-annex { stroke: var(--annex); } .tick.k-event { stroke: var(--faint); }
.win { fill: none; stroke: var(--ink); stroke-opacity: .35; stroke-width: 1; }
.cursor { stroke: var(--state); stroke-width: 2.5; stroke-linecap: round; }
.cursor-dot { fill: var(--state); stroke: var(--panel); stroke-width: 2; }
#year {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
#year::-webkit-slider-runnable-track { height: 100%; background: transparent; }
#year::-moz-range-track { height: 100%; background: transparent; }
#year::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 32px; background: transparent; border: none; }
#year::-moz-range-thumb { width: 14px; height: 32px; background: transparent; border: none; }
#year:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.bubble {
  position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); pointer-events: none; white-space: nowrap; z-index: 4;
  background: var(--ink); color: var(--panel); border-radius: 6px; padding: 3px 8px; font: 12px var(--f-mono);
}

.dialwrap { grid-area: dial; position: relative; height: 46px; }
.dial {
  height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: ew-resize;
  touch-action: pan-x; overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
}
.dial::-webkit-scrollbar { display: none; }
.dial svg { display: block; }
.d-minor { stroke: var(--faint); stroke-width: 1; }
.d-dec { stroke: var(--muted); stroke-width: 1; }
.d-cent { stroke: var(--ink); stroke-width: 1.5; }
.d-lbl { font: 10px var(--f-mono); fill: var(--faint); }
.d-lbl.c { font-size: 11px; fill: var(--ink); font-weight: 700; }
.needle { position: absolute; left: 50%; top: 10px; bottom: 2px; width: 2px; margin-left: -1px; background: var(--state); border-radius: 1px; pointer-events: none; }
.needle::before {
  content: ""; position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
  border: 5px solid transparent; border-top: 6px solid var(--state); border-bottom: 0;
}

/* ---------- О карте ---------- */
dialog {
  border: 1px solid var(--rule); border-radius: 14px; padding: 0;
  width: min(760px, calc(100vw - 24px)); max-width: none; max-height: calc(100dvh - 24px);
  background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 15, 18, .5); }
.about { padding: 22px 26px 28px; overflow-y: auto; max-height: calc(100dvh - 26px); box-sizing: border-box; }
.about h2 { font: 700 26px var(--f-display); margin: 0 0 10px; }
.about h3 { font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 24px 0 8px; }
.about p, .about li { max-width: 68ch; line-height: 1.5; }
.about ul { padding-left: 20px; margin: 6px 0; }
.about li { margin: 4px 0; }
.about table { border-collapse: collapse; font-size: 13px; width: 100%; }
.about td { border-top: 1px solid var(--rule); padding: 5px 10px 5px 0; vertical-align: top; }
.about td:first-child { font: 12px var(--f-mono); white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.about a { color: var(--focus); }
.about .close { float: right; margin-left: 12px; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 7px 16px; font-size: 13.5px; }
.lg { display: flex; gap: 9px; align-items: center; }
.lg svg { flex: none; }
.tblwrap { overflow-x: auto; }

/* ---------- телефон и планшет ---------- */
@media (max-width: 899px) {
  body { display: block; }
  .phead { display: none; }
  .mapwrap { position: fixed; inset: 0; }
  .card {
    top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
